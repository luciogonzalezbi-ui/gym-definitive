<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Gym Guide</title>
<style>
:root{
  --bg:#F3F2FC; --s1:#FFFFFF; --s2:#E8E6F8; --line:#D2CEEE; --tx:#191636; --mu:#575481;
  --ac:#6D4DFF; --ac-ink:#FFFFFF; --ac-tx:#5233E0; --ac2:#E58A00; --ok:#0E8F5B; --bad:#C23A3A; --focus:#1560BD;
  --sk:#E9B995; --pn:#2C3157;
  --r:14px; --nav-h:64px;
  --disp:Bahnschrift,"Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F1F; --s1:#171A31; --s2:#212546; --line:#30355F; --tx:#EFF0FF; --mu:#A0A5CC;
    --ac:#7C5CFF; --ac-ink:#FFFFFF; --ac-tx:#B2A6FF; --ac2:#FFB020; --ok:#3DDC97; --bad:#FF7A7A; --focus:#8CC8FF;
    --sk:#E9B995; --pn:#5C66B5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F1F; --s1:#171A31; --s2:#212546; --line:#30355F; --tx:#EFF0FF; --mu:#A0A5CC;
  --ac:#7C5CFF; --ac-ink:#FFFFFF; --ac-tx:#B2A6FF; --ac2:#FFB020; --ok:#3DDC97; --bad:#FF7A7A; --focus:#8CC8FF;
  --sk:#E9B995; --pn:#5C66B5; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:700;letter-spacing:.01em;line-height:1.1}
h1{font-size:clamp(1.9rem,6vw,2.6rem)} h2{font-size:1.35rem;margin-bottom:10px} h3{font-size:1.1rem}
p{max-width:68ch} a{color:var(--ac-tx)}
.muted{color:var(--mu)} .small{font-size:.875rem} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* shell */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--s1);border-top:1px solid var(--line);padding:0 4px env(safe-area-inset-bottom,0px)}
#nav .brand{display:none}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);text-decoration:none;color:var(--mu);font-size:.75rem;font-weight:500}
#nav a svg{width:24px;height:24px}
#nav a[aria-current="page"]{color:var(--ac-tx)}
#nav a[aria-current="page"] svg{stroke-width:2.6}
#main{padding:20px 16px calc(var(--nav-h) + 28px);max-width:980px;margin:0 auto;outline:none}
body.focus #nav{display:none}
body.focus #main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  #nav{top:0;right:auto;bottom:0;width:216px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:24px 12px;gap:4px;justify-content:flex-start}
  #nav .brand{display:block;font-family:var(--disp);font-weight:700;font-size:1.6rem;padding:0 12px 20px}
  #nav .brand span{color:var(--ac-tx)}
  #nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;font-size:1rem;border-radius:10px}
  #nav a[aria-current="page"]{background:var(--s2)}
  #main{margin-left:216px;max-width:none;padding:36px 40px 60px}
  #main>*{max-width:900px}
  body.focus #main{margin-left:0;padding:0 24px 160px}
  body.focus #main>*{margin-left:auto;margin-right:auto}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--s1);cursor:pointer;font-weight:600;text-decoration:none;color:var(--tx);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.big{min-height:60px;font-size:1.15rem;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--tx)}
.icon:hover{background:var(--s2)}
.icon svg,.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.stack>*+*{margin-top:14px} .stack-l>*+*{margin-top:28px}
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--s1)}
textarea{min-height:92px;resize:vertical}
.fieldset{border:0;padding:0}
.fieldset legend{font-weight:600;margin-bottom:8px;padding:0}
.chips-in{display:flex;flex-wrap:wrap;gap:8px}
.chips-in input{position:absolute;opacity:0;width:1px;height:1px}
.chips-in label{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);cursor:pointer;font-weight:500}
.chips-in input:checked+label{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:600}
.chips-in input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.exbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--s1)}
.exbox .chips-in label{min-height:38px;font-size:.9rem}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--s2);font-size:.8rem;font-weight:600}
.badge.ac{background:var(--ac);color:var(--ac-ink)}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.today{border-left:6px solid var(--ac);border-radius:6px var(--r) var(--r) 6px;padding:20px}
.note{border-left:4px solid var(--ac);background:var(--s2);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.92rem}
.note.warn{border-color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center}
.empty p{margin:6px auto 14px}
.stats{display:flex;border-block:1px solid var(--line);padding:14px 0}
.stats>div{flex:1;padding:0 12px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0;padding-left:0}
.stats .n{font-family:var(--disp);font-weight:700;font-size:2.1rem;line-height:1}
.stats .n small{font-size:1rem;color:var(--mu);font-weight:500}
.list{list-style:none;padding:0;display:grid;gap:8px}
.list a.item,.list .item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);text-decoration:none;color:var(--tx)}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac)}
.grid2{display:grid;gap:14px}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--ac)} .chart .ax{fill:var(--mu);font-size:10px} .chart .ln{fill:none;stroke:var(--ac-tx);stroke-width:2.4} .chart .pt{fill:var(--s1);stroke:var(--ac-tx);stroke-width:2} .chart .gl{stroke:var(--line);stroke-width:1}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--ac)}
details.ex{border:1px solid var(--line);border-radius:12px;background:var(--s1)}
details.ex summary{padding:12px 14px;cursor:pointer;min-height:48px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
details.ex .body{padding:0 14px 14px}
details.ex ul{padding-left:20px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:.8rem;color:var(--mu)}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:.9rem;background:var(--s1);border:1px solid var(--line);text-decoration:none;color:var(--tx)}
.cal .d.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:700}
.cal .d.today{outline:2px solid var(--tx);outline-offset:-2px}
.cal .d.x{background:none;border-color:transparent}

/* onboarding */
.ob{max-width:560px;margin:0 auto;padding-top:28px}
.ob .bar{margin:12px 0 22px}

/* workout */
.wk-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.wk-top .t{flex:1;min-width:0}
.wk-top .t strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--disp);font-size:1.2rem}
.exnav{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.exnav button{flex:none;max-width:180px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--s1);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem}
.exnav button[aria-current="true"]{border-color:var(--ac);box-shadow:inset 0 -4px 0 var(--ac)}
.exnav button.fin{background:var(--s2);color:var(--mu)}
.exnav button.skp{text-decoration:line-through;color:var(--mu)}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 72px 56px;gap:8px;align-items:center;padding:8px 0}
.setrow .sn{font-family:var(--disp);font-size:1.25rem;font-weight:700;color:var(--mu);text-align:center}
.setrow input,.setrow select{min-height:56px;font-size:1.2rem;font-weight:600;text-align:center;padding:4px 6px}
.setrow select{font-size:1rem}
.setrow input.pre{color:var(--mu);font-weight:500}
.setrow .u{display:block;font-size:.72rem;color:var(--mu);text-align:center;margin-top:2px}
.chk{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--s1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mu);transition:transform .1s,background .1s}
.chk:active{transform:scale(.9)}
.chk svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.setrow.done input{border-color:var(--ok)}
#restPanel{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s1);border-top:3px solid var(--ac);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#restPanel .in{max-width:560px;margin:0 auto}
#restTime{font-family:var(--disp);font-size:2.6rem;font-weight:700;line-height:1}
@media (min-width:900px){#restPanel .in{max-width:900px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:500;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
body.focus #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.md{background:var(--s1);color:var(--tx);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:18px}}
.md h2{margin-bottom:8px}
.md .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.md .opts{display:grid;gap:8px;margin-top:12px}
.md .opts .btn{justify-content:flex-start;text-align:left}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== v2: interfaz renovada ===== */
body{background:radial-gradient(900px 380px at 100% -80px,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
h1{letter-spacing:.005em}
#nav .pill{display:flex;align-items:center;justify-content:center;padding:3px 18px;border-radius:99px;transition:background .15s}
#nav a[aria-current="page"] .pill{background:var(--ac);color:var(--ac-ink)}
#nav a[aria-current="page"]{color:var(--tx);font-weight:600}
@media (min-width:900px){#nav a[aria-current="page"]{background:var(--s2)}#nav .pill{padding:6px 8px}}
.card{border-radius:18px}
.btn.dark{background:#17120A;border-color:#17120A;color:#F7C95B}
.hero{position:relative;overflow:hidden;background:var(--ac);color:var(--ac-ink);border-radius:22px;padding:22px 20px 20px}
.hero .herotitle{font-size:clamp(2rem,8vw,2.8rem);margin:2px 0 6px}
.hero p{max-width:none}
.hero .btn.big{margin-top:16px}
.hero.soft{background:var(--s1);color:var(--tx);border:1px solid var(--line)}
.herodeco{position:absolute;right:-30px;top:6px;width:240px;fill:currentColor;opacity:.13;pointer-events:none}
.herothumbs{display:flex;gap:8px;margin-top:14px}
.herothumbs .thumb{width:calc((100% - 24px)/4);max-width:88px;background:rgba(255,255,255,.55)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:4px 0}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;color:var(--mu);font-weight:600}
.wd i{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.wd i svg{width:18px;height:18px}
.wd.sch i{border:2px solid var(--ac-tx)}
.wd.on i{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.wd.td span{color:var(--tx)}
.wd.td i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tx)}
.stats{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px 6px}
.stats .n{font-size:2.3rem;font-variant-numeric:tabular-nums}
.list a.item,.list .item{border-radius:14px}
.exfig{margin:0}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frames.one{grid-template-columns:1fr;max-width:260px}
.fr{background:var(--s2);border-radius:14px;padding:6px 6px 4px;text-align:center}
.fr figcaption{font-size:.78rem;color:var(--mu);font-weight:600;margin-top:2px}
.figleg{margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.thumb{display:block;width:64px;flex:none;background:var(--s2);border-radius:12px;padding:2px;overflow:hidden}
.thumb svg{display:block;width:100%;height:auto}
.sumtxt{display:flex;gap:12px;align-items:center;min-width:0}
.obfig{display:flex;gap:10px;margin-bottom:18px}.obfig .thumb{width:84px}
.fig{display:block;width:100%;height:auto}
.btn.big{white-space:nowrap}.hero .btn.big{font-size:1.05rem}
.fig .fl{stroke:var(--line);stroke-width:2;fill:none}
.fig .fu{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.fig .fb,.fig .ff,.fig .gl{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fb{stroke:var(--tx);stroke-width:7}
.fig .ff{stroke:var(--mu);stroke-width:6;opacity:.5}
.fig .gl{stroke:var(--tx);stroke-width:3}
.fig .gh{opacity:.16}
.fig .hd{fill:var(--tx)}
.fig .eqb{fill:none;stroke:var(--tx);stroke-width:3}
.fig .eqd{fill:var(--tx)}
.fig .eqd2{fill:var(--ac);stroke:var(--tx);stroke-width:1.5}
.fig .cab{stroke:var(--mu);stroke-width:1.6}
.fig .band{stroke:var(--ok);stroke-width:2.4;stroke-dasharray:4 3}
.fig .pul{fill:var(--bg);stroke:var(--mu);stroke-width:1.5}
.setrow.done{background:color-mix(in srgb,var(--ok) 13%,transparent);border-radius:14px}
.setrow{padding:8px 6px}
.exnav button[aria-current="true"]{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);box-shadow:none;font-weight:600}
#restPanel{border-radius:22px 22px 0 0}
#restPanel .restL{display:flex;align-items:center;gap:12px}
.ring{width:60px;height:60px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .rb{stroke:var(--s2)}
.ring .rf{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
#restTime{font-variant-numeric:tabular-nums}
details.ex{border-radius:16px}

/* ===== v3: nueva paleta y diseño ===== */
.btn.dark{background:#fff;border-color:#fff;color:#3A20C8}
.hero{background:linear-gradient(135deg,#5B3BFF 0%,#8A4DFF 55%,#E24DB5 100%);color:#fff;box-shadow:0 10px 30px -12px rgba(109,77,255,.55)}
.hero.soft{background:var(--s1);color:var(--tx);box-shadow:none}
.herodeco{fill:#fff;opacity:.16}
.hero.soft .herodeco{fill:currentColor;opacity:.08}
.herothumbs .thumb{background:var(--s1)}
.md{max-width:620px}
.fig .sk{fill:none;stroke:var(--sk);stroke-linecap:round;stroke-linejoin:round}
.fig .sh{fill:none;stroke:var(--ac);stroke-linecap:round;stroke-linejoin:round}
.fig .pn{fill:none;stroke:var(--pn);stroke-linecap:round;stroke-linejoin:round}
.fig .sn{fill:none;stroke:var(--ac2);stroke-linecap:round}
.fig .skf{fill:var(--sk)}
.fig .hair{fill:#3A2A22}
.fig .far{opacity:.5}
.fig .arr{stroke:var(--ac2);stroke-width:2.8;stroke-dasharray:6 4;stroke-linecap:round}
.fig .arrh{fill:var(--ac2)}
.fig .fl{stroke-width:2.5}
.fig .gh{opacity:.2}
.fig .gl{stroke:var(--tx)}
.fr{padding:4px 4px 6px}
.libgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.libgrid{grid-template-columns:repeat(3,1fr)}}
.lcard{display:flex;flex-direction:column;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0;cursor:pointer;color:var(--tx);transition:transform .1s}
.lcard:active{transform:scale(.98)}
.lcard .limg{display:block;background:var(--s2)}
.lcard .thumb{width:100%;border-radius:0;padding:0;background:transparent}
.lcard .ltx{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px;align-items:flex-start}
.lcard .ltx strong{font-family:var(--disp);font-size:1.05rem;line-height:1.15}
.exfig .frames{gap:10px}

/* ===== v4: videos e importación ===== */
.vidbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.vidbox>strong{width:100%}
.vplay{width:100%}
input[type=url],input[type=file]{width:100%;min-height:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--s1)}
.lcard .limg:empty{display:block;min-height:70px}
</style>
</head>
<body>
<nav id="nav" aria-label="Principal"></nav>
<main id="main" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<noscript><p style="padding:20px">Gym Guide necesita JavaScript para funcionar.</p></noscript>

<script>
'use strict';
/* =========================================================
   Datos base
   ========================================================= */
const WD=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

    q.k2=q.k2||[q.k[0]-5,q.k[1]];q.a2=q.a2||[q.a[0]-5,q.a[1]];q.t2=q.t2||[q.t[0]-5,q.t[1]];
  }

}

  if(ex.t==='Core')return{sets:lvl===1?2:3,repMin:ex.reps[0],repMax:ex.reps[1],rest:60,rir:''};
  let reps,rest,sets;
  const G=goal||'salud';
  if(G==='fuerza'){reps=comp?(light?ex.reps:[4,6]):[8,12];rest=comp&&!light?180:90;sets=comp?(lvl===1?3:4):(lvl===1?2:3)}

function genRoutine(splitKey){

  const nEx=({30:4,45:5,60:6,75:7,90:7})[+p.minutes]||5;
  const nDays=Math.min(6,Math.max(1,+p.days||3));
  const sp=SPLITS[splitKey], used=new Set(), missing=new Set();

  const days=[];
  for(let i=0;i<nDays;i++){
    const tpl=sp.days[i%sp.days.length];
    const slots=tpl[1].slice(0,nEx), exs=[];
    slots.forEach(slot=>{
      let c=LIST.filter(x=>x.s.includes(slot)&&eq.has(x.e)&&x.l<=lvl&&!avoid.has(x.id));
      c.sort((a,b)=>(pref.has(a.id)?0:1)-(pref.has(b.id)?0:1)||b.l-a.l||LIST.indexOf(a)-LIST.indexOf(b));

function barSvg(items,label){
  const W=320,H=120,pad=10,n=items.length,slot=(W-pad*2)/n,bw=Math.max(8,Math.min(34,slot*.62)),max=Math.max(1,...items.map(i=>i.v));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+30}" role="img" aria-label="${esc(label+': '+items.map(i=>i.l+' '+fmtN(i.v)).join(', '))}">`;
  s+=`<line class="gl" x1="0" x2="${W}" y1="${H}" y2="${H}"/>`;
  items.forEach((it,i)=>{
    const x=pad+i*slot+(slot-bw)/2,bh=Math.round(it.v/max*(H-16));
    if(bh>0)s+=`<rect class="bar" x="${x}" y="${H-bh}" width="${bw}" height="${bh}" rx="3"/>`;
    if(it.v>0&&n<=12)s+=`<text class="ax" x="${x+bw/2}" y="${H-bh-4}" text-anchor="middle">${fmtN(it.v)}</text>`;
    if(n<=12||i%2===0)s+=`<text class="ax" x="${x+bw/2}" y="${H+16}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  return s+'</svg>';
}
function lineSvg(pts,label,unit){
  const W=320,H=150,px=36,py=18;
  let ymin=Math.min(...pts.map(p=>p.y)),ymax=Math.max(...pts.map(p=>p.y));
  if(ymin===ymax){ymin-=1;ymax+=1}
  const xmin=pts[0].x,xmax=pts[pts.length-1].x||1;
  const X=x=>px+(xmax===xmin?0.5:(x-xmin)/(xmax-xmin))*(W-px-12), Y=y=>H-py-(y-ymin)/(ymax-ymin)*(H-py*2);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+14}" role="img" aria-label="${esc(label+': '+pts.map(p=>fmtD(p.x)+' '+fmtN(p.y)+' '+unit).join(', '))}">`;
  s+=`<line class="gl" x1="${px}" x2="${W-6}" y1="${Y(ymin)}" y2="${Y(ymin)}"/><line class="gl" x1="${px}" x2="${W-6}" y1="${Y(ymax)}" y2="${Y(ymax)}"/>`;
  s+=`<text class="ax" x="${px-4}" y="${Y(ymax)+3}" text-anchor="end">${fmtN(ymax)}</text><text class="ax" x="${px-4}" y="${Y(ymin)+3}" text-anchor="end">${fmtN(ymin)}</text>`;
  s+=`<polyline class="ln" points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
  pts.forEach(p=>{s+=`<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="4"/>`});
  s+=`<text class="ax" x="${px}" y="${H+8}">${fmtD(xmin)}</text><text class="ax" x="${W-6}" y="${H+8}" text-anchor="end">${fmtD(xmax)}</text>`;
  return s+'</svg>';
}

function weekStrip(r){

    const d=new Date(ws);d.setDate(d.getDate()+i);const wd=d.getDay(),k=dayKey(d.getTime());
    const done=state.sessions.some(x=>dayKey(x.start)===k),sch=!!(r&&r.days.some(x=>x.weekday===wd));
    return `<div class="wd ${done?'on':sch?'sch':''} ${k===todayK?'td':''}" role="img" aria-label="${WD[wd]}: ${done?'entrenaste':sch?'entrenamiento previsto':'descanso'}"><span aria-hidden="true">${l}</span><i aria-hidden="true">${done?ic('check',3):''}</i></div>`;
  }).join('');

}

const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const WDMAP={domingo:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6};
const STOP=new Set(['de','con','en','a','al','la','el','una','un','mano','los','las','y']);
const ALIASES={'press banca':'press-banca','press de banca':'press-banca','banca':'press-banca','press inclinado':'press-mancuernas','press pecho':'press-pecho-maq','aperturas':'aperturas-polea','cruces':'aperturas-polea','remo':'remo-barra','remo mancuerna':'remo-mancuerna','jalon':'jalon','jalon al pecho':'jalon','polea al pecho':'jalon','dominadas':'dominadas','dominada':'dominadas','press militar':'press-militar-barra','press hombros':'press-militar-manc','press de hombros':'press-militar-manc','elevaciones laterales':'elev-laterales','vuelos laterales':'elev-laterales','pajaros':'pajaros','vuelos posteriores':'pajaros','face pull':'face-pull','curl':'curl-manc','curl biceps':'curl-manc','biceps':'curl-manc','triceps':'ext-triceps-polea','extension triceps':'ext-triceps-polea','triceps polea':'ext-triceps-polea','sentadilla':'sentadilla-barra','sentadillas':'sentadilla-barra','squat':'sentadilla-barra','prensa':'prensa','prensa de piernas':'prensa','leg press':'prensa','zancadas':'zancadas-manc','estocadas':'zancadas-manc','bulgara':'sentadilla-bulgara','peso muerto rumano':'pm-rumano-barra','peso muerto':'pm-rumano-barra','rumano':'pm-rumano-barra','curl femoral':'curl-femoral','femoral':'curl-femoral','extension cuadriceps':'ext-cuadriceps','cuadriceps':'ext-cuadriceps','hip thrust':'hip-thrust','puente gluteos':'puente-gluteos','gemelos':'elev-talones-pie','pantorrillas':'elev-talones-pie','elevacion talones':'elev-talones-pie','plancha':'plancha','abdominales':'crunch-polea','crunch':'crunch-polea','flexiones':'flexiones'};
function matchEx(name){
  const n=norm(name);if(!n)return null;
  const ex=LIST.find(e=>norm(e.n)===n);if(ex)return ex.id;
  const al=ALIASES[n]||ALIASES[n.replace(/s$/,'')];if(al&&LIB[al])return al;
  const tk=x=>new Set(norm(x).split(' ').filter(w=>w&&!STOP.has(w)).map(w=>w.replace(/(es|s)$/,'')));
  const a=tk(name);if(!a.size)return null;
  let best=null,bs=0;
  LIST.forEach(e=>{if(e.custom)return;const b=tk(e.n);let c=0;a.forEach(w=>{if(b.has(w))c++});const sc=c/(a.size+b.size-c);if(sc>bs){bs=sc;best=e.id}});
  return bs>=0.5?best:null;
}

  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/\t/g,' ').trim()).filter(Boolean).slice(0,400);
  for(const raw of lines){
    let l=raw.replace(/^\s*(?:[-*•–]|\d+[.)])\s+/,'');
    let url=null;const um=l.match(/https?:\/\/\S+/i);
    if(um){url=um[0].replace(/[),.;]+$/,'');l=l.replace(um[0],'').trim()}
    if(!l&&url){if(cur&&cur.exercises.length)cur.exercises[cur.exercises.length-1].url=url;continue}
    const rp=l.match(/(\d{1,2})\s*(?:[x×*]|series?\s*(?:de|x)?)\s*(\d{1,3})(?:\s*(?:-|–|a)\s*(\d{1,3}))?/i);
    const rs=l.match(/descanso\s*:?\s*(\d{1,3})\s*(min\w*|m\b|s\b|seg\w*)?/i)||l.match(/(\d{1,3})\s*(min\w*|s\b|seg\w*)\s*(?:de\s*)?descanso/i);
    const rr=l.match(/rir\s*:?\s*([0-5](?:\s*[-–]\s*[0-5])?)/i);
    const nl=norm(l),first=nl.split(' ')[0];
    const header=/^(dia|rutina|sesion|bloque|semana)\b/.test(nl)||WDMAP[first]!==undefined||(/[:：]\s*$/.test(l)&&!rp);
    if(header&&!rp){mk(l.replace(/[:：]\s*$/,'').slice(0,60),WDMAP[first]!==undefined?WDMAP[first]:null);continue}
    let name=l;
    [rp,rs,rr].forEach(m=>{if(m)name=name.replace(m[0],' ')});
    name=name.replace(/[:;,()\[\]]|\s[-–]\s/g,' ').replace(/\s+/g,' ').replace(/\s+(de|con|a)$/i,'').trim();
    if(!name){ignored.push(raw);continue}
    const id=matchEx(name);
    if(!rp&&!id){
      if(name.split(' ').length<=5){if(cur&&!cur.exercises.length)cur.name=(cur.name+' - '+name).slice(0,60);else mk(name.slice(0,60),null)}
      else ignored.push(raw);
      continue;
    }
    if(!cur)mk('Día 1',null);
    let rest=null;
    if(rs){let n=+rs[1];const u=(rs[2]||'').toLowerCase();rest=u.startsWith('m')?n*60:(u===''&&n<=10?n*60:n)}
    cur.exercises.push({name,exId:id,sets:rp?+rp[1]:null,repMin:rp?+rp[2]:null,repMax:rp?+(rp[3]||rp[2]):null,rest,rir:rr?rr[1].replace(/\s/g,''):'',url});
  }
  return{days:days.filter(d=>d.exercises.length),ignored};
}
function groupPdfItems(items){
  const rows={};
  items.forEach(it=>{if(!it||typeof it.str!=='string'||!it.str.trim())return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push([it.transform[4],it.str])});
  return Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a[0]-b[0]).map(r=>r[1]).join(' ').replace(/\s+/g,' ').trim());
}
async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('carga'));document.head.appendChild(sc)});
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}
async function pdfText(file){
  const lib=await loadPdfJs(),doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let i=1;i<=Math.min(doc.numPages,30);i++){const pg=await doc.getPage(i),tc=await pg.getTextContent();out.push(...groupPdfItems(tc.items),'')}
  return out.join('\n');
}
async function impFile(file){

    if(!text.trim()){modal({title:'No se pudo leer texto',body:'<p>El archivo no contiene texto seleccionable (puede ser un PDF escaneado o una imagen). Copia el texto de tu rutina y pégalo en el cuadro de abajo.</p>',actions:[{label:'Entendido',cls:'primary'}]});return}

  ${ex.skipped?`<div class="note">Ejercicio omitido. <button class="btn sm" data-a="wk-skip">Reactivar</button></div>`:`
  ${exFig(ex.exId)}
  ${last.length?`<p class="muted small">Última vez: ${last.map(s=>esc(setLine(s,L))).join(', ')}</p>`:`<p class="muted small">Es la primera vez que registras este ejercicio. Empieza con un peso que controles bien.</p>`}
  ${sg?`<div class="note"><strong>Sugerencia:</strong> completaste ${state.settings.need} sesión(es) seguida(s) con ${fmtN(sg.from)} kg en el máximo de repeticiones. ¿Probamos con ${fmtN(sg.to)} kg hoy?<div class="row" style="margin-top:8px"><button class="btn sm primary" data-a="sugg-apply" data-w="${sg.to}">Usar ${fmtN(sg.to)} kg</button><button class="btn sm" data-a="sugg-dismiss" data-k="${esc(sg.key)}">Ahora no</button></div></div>`:''}
  <div>${ex.sets.map((s,i)=>`<div class="setrow ${s.done?'done':''}"><span class="sn" aria-hidden="true">${i+1}</span>
    <div>${L.time?'<div class="u" style="margin:0 0 2px">&nbsp;</div>':''}<label class="sr" for="kg${s.id}">${L.time?'Peso (opcional)':'Peso en kg'}, serie ${i+1}</label><input id="kg${s.id}" type="text" inputmode="decimal" autocomplete="off" class="${s.pre?'pre':''}" data-f="aset" data-x="${s.id}" data-k="kg" value="${esc(s.kg)}" placeholder="0"><span class="u">kg</span></div>
    <div><label class="sr" for="rp${s.id}">${L.time?'Segundos':'Repeticiones'}, serie ${i+1}</label><input id="rp${s.id}" type="text" inputmode="numeric" autocomplete="off" class="${s.pre?'pre':''}" data-f="aset" data-x="${s.id}" data-k="reps" value="${esc(s.reps)}" placeholder="${ex.plan.repMin}"><span class="u">${L.time?'seg':'reps'}</span></div>
    <div><label class="sr" for="ri${s.id}">RIR, serie ${i+1} (opcional)</label><select id="ri${s.id}" data-f="aset" data-x="${s.id}" data-k="rir"><option value="">RIR</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${String(s.rir)===String(n)?'selected':''}>${n}</option>`).join('')}</select></div>
    <button class="chk" data-a="wk-toggle" data-x="${s.id}" aria-pressed="${s.done}" aria-label="${s.done?'Desmarcar':'Marcar como completada'} la serie ${i+1}">${ic('check')}</button></div>`).join('')}</div>
  <div class="row"><button class="btn sm" data-a="wk-addset">${ic('plus')} Serie</button><button class="btn sm" data-a="wk-delset">Quitar última serie</button>
    <span style="margin-left:auto"><label class="sr" for="restSel">Descanso de este ejercicio</label><select id="restSel" data-f="wkrest" style="width:auto">${[0,30,45,60,75,90,120,150,180,240,300].map(n=>`<option value="${n}" ${ex.plan.rest===n?'selected':''}>${n?'Descanso '+n+' s':'Sin descanso'}</option>`).join('')}${[0,30,45,60,75,90,120,150,180,240,300].includes(ex.plan.rest)?'':`<option value="${ex.plan.rest}" selected>Descanso ${ex.plan.rest} s</option>`}</select></span></div>

  ${state.routines.length&&getR(a.routineId)&&getR(a.routineId).warmup?`<p class="muted small" style="margin-top:14px">${esc(getR(a.routineId).warmup)}</p>`:''}
  <div style="margin-top:18px"><label class="f" for="wkn">Notas de la sesión</label><textarea id="wkn" maxlength="800" data-f="wknotes" placeholder="Cómo te sentiste, ajustes, molestias…">${esc(a.notes||'')}</textarea></div>
  <p class="note warn" style="margin-top:16px">Detén el ejercicio si sientes dolor agudo, mareo u otros síntomas que te preocupen, y consulta a un profesional. El dolor no es fatiga normal.</p>
  <div style="margin-top:16px"><button class="btn danger sm" data-a="wk-cancel">Descartar entrenamiento</button></div>
  <div id="restPanel" hidden role="region" aria-label="Temporizador de descanso"><div class="in"><div class="row sp"><div class="restL"><svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="rb" cx="32" cy="32" r="27"/><circle id="restRing" class="rf" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg><div><span class="muted small">Descanso</span><div id="restTime">0:00</div></div></div><div class="row"><button class="btn sm" data-a="rest-add" data-s="-15">−15 s</button><button class="btn sm" data-a="rest-add" data-s="15">+15 s</button><button class="btn sm primary" data-a="rest-skip">Saltar</button></div></div></div></div>`;
}

let wakeLock=null;
async function keepAwake(){try{if(state.active&&'wakeLock'in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25);setTimeout(()=>c.close(),500)}catch(e){}}
function tick(){
  const a=state.active,el=$('#elapsed');
  if(el&&a)el.textContent=fmtClock((Date.now()-a.start)/1000);
  const panel=$('#restPanel');if(!panel)return;
  if(a&&a.rest){
    const left=Math.ceil((a.rest.end-Date.now())/1000);
    if(left<=0){a.rest=null;save();panel.hidden=true;toast('Descanso terminado. Siguiente serie.');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep()}
    else{panel.hidden=false;$('#restTime').textContent=fmtClock(left);$('#restRing').style.strokeDashoffset=String(169.6*Math.min(1,Math.max(0,1-left/a.rest.total)))}
  }else panel.hidden=true;
}
setInterval(tick,250);

function startWorkout(rid,did){
  if(state.active){toast('Ya tienes un entrenamiento en curso.');location.hash='#/entreno';return}
  const r=getR(rid),d=r&&r.days.find(x=>x.id===did);if(!d)return;
  state.active={id:uid(),routineId:r.id,dayId:d.id,name:d.name,routineName:r.name,start:Date.now(),cur:0,notes:'',rest:null,
    exercises:d.exercises.map(e=>({iid:e.iid,exId:e.exId,skipped:false,plan:{sets:e.sets,repMin:e.repMin,repMax:e.repMax,rest:e.rest,rir:e.rir,note:e.note||''},sets:buildSets(e.exId,e.sets)}))};
  save();keepAwake();location.hash='#/entreno';
}
function finishWorkout(){
  const a=state.active;if(!a)return;
  const s=Object.assign({},a,{end:Date.now(),status:'done'});delete s.rest;delete s.cur;
  s.exercises=s.exercises.map(e=>({iid:e.iid,exId:e.exId,skipped:e.skipped,plan:e.plan,sets:e.sets.map(x=>({id:x.id,kg:x.kg,reps:x.reps,rir:x.rir,done:x.done,ts:x.ts||null}))}));
  const i=state.sessions.findIndex(x=>x.id===s.id);
  if(i>=0)state.sessions[i]=s;else state.sessions.push(s);
  state.active=null;save();
  if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}
  location.hash='#/resumen/'+s.id;
}

};

function onField(t,ev){
  const f=t.dataset.f,v=t.value;
  switch(f){
    case'profile':{
      const k=t.dataset.k,p=state.profile;
      if(t.type==='checkbox'&&t.hasAttribute('data-multi')){
        const s=new Set(p[k]||[]);t.checked?s.add(t.value):s.delete(t.value);p[k]=[...s];
        if(t.checked&&(k==='preferred'||k==='avoid')){
          const o=k==='preferred'?'avoid':'preferred';
          if((p[o]||[]).includes(t.value)){p[o]=p[o].filter(x=>x!==t.value);const el=$(`#pf-${o}-${t.value}`);if(el)el.checked=false}
        }
      }else p[k]=v;
      save();
      if(k==='age'){const n=$('#ageNote');if(n)n.hidden=p.age!=='<18'}
      break}
    case'rmeta':{const r=getR(t.dataset.r);r[t.dataset.k]=v;r.modified=Date.now();save();break}
    case'rx':{
      const r=getR(t.dataset.r),d=r.days[+t.dataset.d],k=t.dataset.k;
      if(t.dataset.i===undefined){d[k]=k==='weekday'?(v===''?null:+v):v;touch(r);break}
      const e=d.exercises[+t.dataset.i];
      if(['sets','repMin','repMax','rest'].includes(k)){
        let n=parseInt(v,10);
        if(ev==='change'){
          const lim={sets:[1,10],repMin:[1,300],repMax:[1,300],rest:[0,600]}[k];
          if(isNaN(n))n=e[k];n=Math.min(lim[1],Math.max(lim[0],n));e[k]=n;
          if(e.repMax<e.repMin){if(k==='repMin')e.repMax=n;else e.repMin=n}
          t.value=n;[['repMin',e.repMin],['repMax',e.repMax]].forEach(([kk,vv])=>{const el=$(`[data-f="rx"][data-r="${t.dataset.r}"][data-d="${t.dataset.d}"][data-i="${t.dataset.i}"][data-k="${kk}"]`);if(el)el.value=vv});touch(r);
        }else if(!isNaN(n))e[k]=n;
      }else{e[k]=v;touch(r)}
      break}
    case'split':ui.genSplit=v;rerender();break;
    case'lib':ui.lib[t.dataset.k]=v;if(t.dataset.k==='q'){if(ev==='input')$('#libList').innerHTML=libList()}else{rerender()}break;
    case'range':ui.range=v;rerender();break;
    case'exSel':ui.exSel=v;rerender();break;
    case'heroEx':ui.heroEx=v;rerender();break;
    case'routFilter':ui.routFilter=v;rerender();break;
    case'cmp':ui.cmp[t.dataset.s]=v;rerender();break;
    case'aset':{
      const a=state.active,ex=a.exercises[a.cur],s=ex.sets.find(x=>x.id===t.dataset.x);if(!s)break;
      s[t.dataset.k]=v;s.pre=false;
      if(t.dataset.k!=='rir'){$$(`[data-x="${s.id}"]`).forEach(i=>i.classList.remove('pre'))}
      save();break}
    case'sset':{
      const s=getS(t.dataset.s),x=s.exercises[+t.dataset.e].sets.find(y=>y.id===t.dataset.x);
      if(x){x[t.dataset.k]=v;save()}break}
    case'wkrest':{const ex=state.active.exercises[state.active.cur];ex.plan.rest=+v;save();break}
    case'wknotes':state.active.notes=v;save();break;
    case'goalTarget':{const g=state.goals.find(x=>x.id===t.dataset.g);const n=parseInt(v,10);if(g&&n>=1&&n<=14){g.target=n;save()}break}
    case'imp-text':ui.imp.text=v;break;
    case'imp-file':{const file=t.files&&t.files[0];if(file)impFile(file);break}
    case'imp-day':ui.imp.parsed.days[+t.dataset.d].name=v;break;
    case'imp-ex':ui.imp.parsed.days[+t.dataset.d].exercises[+t.dataset.i].exId=v==='__new'?null:v;break;
    case'theme':state.settings.theme=v;save();applyTheme();break;
    case'set-inc':state.settings.inc=+v;save();break;
    case'set-need':state.settings.need=+v;save();break;
    case'set-rest':state.settings.rest=+v;save();break;
    case'remind-on':state.settings.remind.on=t.checked;save();break;
    case'remind-time':if(v)state.settings.remind.time=v;save();break;
    case'remind-day':{const s=new Set(state.settings.remind.days);t.checked?s.add(+t.value):s.delete(+t.value);state.settings.remind.days=[...s];save();break}
  }
}

    <p class="note warn">Limitaciones: no hay sincronización entre dispositivos y si borras los datos del navegador o cambias de equipo los pierdes. Exporta una copia de vez en cuando. Este texto es informativo y no reemplaza una política de privacidad legal.</p>
    ${storageOk?'':`<p class="note warn">Este navegador no permite guardar datos de forma persistente. Lo que registres se perderá al cerrar la pestaña.</p>`}
    <div class="row"><button class="btn" data-a="data-export">Exportar copia</button><button class="btn" data-a="data-import">Importar copia</button><button class="btn danger" data-a="data-wipe">Eliminar todos mis datos</button></div></div>
  ${disclaimer()}</section>`;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root .ov'))closeModal()});

/* =========================================================
   Arranque
   ========================================================= */
applyTheme();
$('#nav').innerHTML=navHtml();
if(state.active)keepAwake();
render(true);
</script>
</body>
